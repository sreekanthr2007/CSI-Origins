[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-bank-mule-detection"
version = "0.1.0"
description = "Privacy-Preserving Federated Graph Intelligence for Cross-Bank Mule Account Detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "networkx>=3.3",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "shap>=0.45.0",
    "pycryptodome>=3.20.0",
    "pytest>=8.3.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = [
    "backend/tests",
    "tests"
]
pythonpath = [
    ".",
    "backend"
]
